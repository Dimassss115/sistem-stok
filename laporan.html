<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Mutasi - Gudangku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
</head>
<body class="bg-[#e9f0f8] h-screen p-3 md:p-4 flex overflow-hidden">

    <!-- FRAME UTAMA APLIKASI -->
    <div class="w-full h-full bg-white rounded-[32px] shadow-2xl flex overflow-hidden">
        
        <!-- SIDEBAR CONTAINER -->
        <aside class="w-64 flex flex-col shrink-0 bg-white">
            <div class="px-6 py-5 flex items-center gap-3 bg-white">
                <div class="p-2 bg-blue-600 text-white rounded-xl shadow-sm">
                    <i data-lucide="box" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Gudangku</h1>
            </div>

            <div class="flex-1 bg-[#1d61d1] text-white flex flex-col justify-between p-6 rounded-tr-[40px]">
                <div class="space-y-6">
                    <button onclick="window.print()" class="w-full bg-white text-[#1d61d1] font-semibold py-3 px-5 rounded-full flex items-center justify-center gap-2 shadow-sm hover:bg-blue-50 transition text-sm">
                        <i data-lucide="printer" class="w-5 h-5"></i>
                        <span>Cetak Laporan</span>
                    </button>

                    <nav class="space-y-1 text-sm font-medium">
    <a href="index.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span>Dashboard</span>
    </a>
    <a href="barang.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
        <i data-lucide="package" class="w-5 h-5"></i>
        <span>Data Barang</span>
    </a>
    <a href="kategori.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
        <i data-lucide="tags" class="w-5 h-5"></i>
        <span>Kategori</span>
    </a>
    <a href="transaksi.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
        <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
        <span>Stok Masuk & Keluar</span>
    </a>
    <a href="laporan.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
        <i data-lucide="file-text" class="w-5 h-5"></i>
        <span>Laporan Mutasi</span>
    </a>
</nav>
                </div>

                <div class="pt-5 border-t border-blue-400/30 text-xs space-y-3">
                    <p class="text-[10px] font-bold tracking-wider text-blue-200 uppercase">Detail Kapasitas</p>
                    <div class="space-y-1">
                        <div class="flex justify-between text-blue-100 text-[11px]">
                            <span class="flex items-center gap-1.5"><i data-lucide="hard-drive" class="w-3.5 h-3.5"></i> Storage Rak</span>
                        </div>
                        <div class="w-full bg-blue-950/40 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-white h-full w-[75%] rounded-full"></div>
                        </div>
                        <p class="text-[10px] text-blue-200">1.240 dari 1.600 slot terpakai</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 flex flex-col overflow-y-auto px-8 py-6">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-lg font-bold text-gray-800">Rekap Laporan Mutasi Stok</h2>
                    <p class="text-xs text-gray-400">Laporan pertanggungjawaban data masuk dan keluar persediaan barang</p>
                </div>
                <button onclick="exportToCSV()" class="px-4 py-2.5 bg-[#1d61d1] text-white text-xs font-semibold rounded-xl hover:bg-blue-700 shadow-sm flex items-center gap-2 transition">
                    <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                </button>
            </header>

            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-5">
                <div class="flex gap-4 border-b border-gray-100 pb-4 text-xs font-medium">
                    <div>
                        <label class="block text-gray-500 mb-1">Dari Tanggal</label>
                        <input type="date" id="tgl-mulai" onchange="filterLaporanByDate()" value="2026-11-01" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-500 mb-1">Sampai Tanggal</label>
                        <input type="date" id="tgl-selesai" onchange="filterLaporanByDate()" value="2026-11-05" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-gray-50/50 text-gray-400 uppercase text-[10px] font-bold tracking-wider">
                                <th class="py-3 px-4">Tanggal</th>
                                <th class="py-3 px-4">Kode SKU</th>
                                <th class="py-3 px-4">Nama Barang</th>
                                <th class="py-3 px-4">Jenis Mutasi</th>
                                <th class="py-3 px-4">Jumlah</th>
                                <th class="py-3 px-4">Petugas Gudang</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-laporan-body" class="divide-y divide-gray-100 text-gray-700">
                            <!-- Data di-render dinamis oleh assets/js/laporan.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/laporan.js"></script>
</body>
</html>
