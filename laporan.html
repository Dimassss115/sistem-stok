<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Mutasi - Gudangku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
</head>
<body class="bg-[#e9f0f8] min-h-screen md:h-screen p-0 md:p-4 overflow-x-hidden md:overflow-hidden">

    <!-- FRAME UTAMA APLIKASI -->
    <div class="w-full min-h-screen md:h-full bg-white md:rounded-[32px] shadow-2xl flex overflow-hidden">
        
        <!-- OVERLAY MOBILE -->
        <button id="sidebar-overlay" onclick="closeSidebar()" aria-label="Tutup menu" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></button>

        <!-- SIDEBAR CONTAINER (Kiri) -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 z-50 w-72 md:w-64 h-screen md:h-full flex flex-col shrink-0 bg-white -translate-x-full md:translate-x-0 transition-transform duration-300">
            
            <!-- LOGO HEADER -->
            <div class="px-6 py-5 flex items-center justify-between bg-white shrink-0">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-blue-600 text-white rounded-xl shadow-sm">
                        <i data-lucide="box" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-xl font-bold text-gray-800 tracking-tight">Gudangku</h1>
                </div>
                <!-- TOMBOL TUTUP MOBILE -->
                <button onclick="closeSidebar()" class="md:hidden p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- PANEL BIRU SIDEBAR -->
            <div class="flex-1 bg-[#1d61d1] text-white flex flex-col justify-between p-5 md:p-6 rounded-tr-[40px] overflow-y-auto">
                <div class="space-y-6">
                    <!-- Tombol Utama -->
                    <button onclick="window.print()" class="w-full bg-white text-[#1d61d1] font-semibold py-3 px-5 rounded-full flex items-center justify-center gap-2 shadow-sm hover:bg-blue-50 transition text-sm">
                        <i data-lucide="printer" class="w-5 h-5"></i>
                        <span>Cetak Laporan</span>
                    </button>

                    <!-- Navigasi Menu Utama -->
                    <nav class="space-y-1 text-sm font-medium">
                        <a href="index.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
                            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                            <span>Dashboard</span>
                        </a>
                        <a href="barang.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
                            <i data-lucide="package" class="w-5 h-5"></i>
                            <span>Data Barang</span>
                        </a>
                        <a href="kategori.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
                            <i data-lucide="tags" class="w-5 h-5"></i>
                            <span>Kategori</span>
                        </a>
                        <a href="transaksi.html" class="flex items-center gap-4 px-4 py-3 text-blue-100 hover:bg-white/10 rounded-full transition">
                            <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
                            <span>Stok Masuk & Keluar</span>
                        </a>
                        <!-- Menu Laporan Aktif -->
                        <a href="laporan.html" class="flex items-center gap-4 px-4 py-3 bg-white text-[#1d61d1] rounded-full font-semibold transition">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                            <span>Laporan Mutasi</span>
                        </a>
                    </nav>
                </div>

                <!-- WIDGET KAPASITAS GUDANG -->
                <div class="pt-5 mt-6 border-t border-blue-400/30 text-xs space-y-3">
                    <p class="text-[10px] font-bold tracking-wider text-blue-200 uppercase">Detail Kapasitas</p>
                    <div class="space-y-1">
                        <div class="flex justify-between text-blue-100 text-[11px]">
                            <span class="flex items-center gap-1.5"><i data-lucide="hard-drive" class="w-3.5 h-3.5"></i> Storage Rak</span>
                        </div>
                        <div class="w-full bg-blue-950/40 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-white h-full w-[75%] rounded-full"></div>
                        </div>
                        <p class="text-[10px] text-blue-200">1.240 dari 1.600 slot terpakai</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 min-w-0 flex flex-col overflow-y-auto px-4 py-5 md:px-8 md:py-6">
            
            <header class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-5 mb-8">
                <!-- Bagian Kiri: Tombol Hamburger & Judul Laporan -->
                <div class="flex items-start gap-3">
                    <!-- HAMBURGER -->
                    <button onclick="toggleSidebar()" aria-label="Buka menu" class="md:hidden p-2.5 bg-blue-50 text-[#1d61d1] rounded-xl shrink-0 mt-1">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <h2 class="text-xl md:text-2xl font-bold text-gray-800">Rekap Laporan Mutasi</h2>
                        <p class="text-xs text-gray-400 mt-1">Laporan pertanggungjawaban data masuk dan keluar persediaan barang</p>
                    </div>
                </div>

                <!-- Tombol Export -->
                <div class="w-full sm:w-auto">
                    <button onclick="exportToCSV()" class="w-full sm:w-auto px-5 py-3 bg-[#1d61d1] text-white text-xs font-semibold rounded-xl hover:bg-blue-700 shadow-sm flex items-center justify-center gap-2 transition">
                        <i data-lucide="download" class="w-4 h-4"></i> Export Data CSV
                    </button>
                </div>
            </header>

            <div class="bg-white p-4 md:p-6 rounded-2xl border border-gray-100 shadow-sm space-y-5">
                
                <!-- Filter Tanggal -->
                <div class="flex flex-col sm:flex-row gap-4 border-b border-gray-100 pb-5 text-xs font-medium">
                    <div class="w-full sm:w-auto">
                        <label class="block text-gray-500 mb-1.5">Dari Tanggal</label>
                        <input type="date" id="tgl-mulai" onchange="filterLaporanByDate()" value="2026-11-01" class="w-full px-3.5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-gray-500 mb-1.5">Sampai Tanggal</label>
                        <input type="date" id="tgl-selesai" onchange="filterLaporanByDate()" value="2026-11-05" class="w-full px-3.5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                    </div>
                </div>

                <!-- Tabel Laporan -->
                <div class="overflow-x-auto">
                    <table class="w-full min-w-[700px] text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-gray-50/70 text-gray-400 uppercase text-[10px] font-bold tracking-wider border-b border-gray-100">
                                <th class="py-4 px-4">Tanggal</th>
                                <th class="py-4 px-4">Kode SKU</th>
                                <th class="py-4 px-4">Nama Barang</th>
                                <th class="py-4 px-4">Jenis Mutasi</th>
                                <th class="py-4 px-4">Jumlah</th>
                                <th class="py-4 px-4">Petugas Gudang</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-laporan-body" class="divide-y divide-gray-100 text-gray-700">
                            <!-- Data di-render dinamis oleh assets/js/laporan.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/laporan.js"></script>

    <script>
        // ==========================================
        // SIDEBAR MOBILE SCRIPT
        // ==========================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar || !overlay) return;
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar || !overlay) return;
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }
    </script>
</body>
</html>
