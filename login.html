<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas - Gudangku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
</head>
<body class="bg-[#e9f0f8] h-screen flex items-center justify-center p-4">

    <!-- LOGIN CARD CONTAINER -->
    <div class="w-full max-w-md bg-white rounded-[32px] p-8 shadow-2xl space-y-6">
        
        <!-- Header Brand -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-[#1d61d1] text-white rounded-2xl flex items-center justify-center mx-auto shadow-md">
                <i data-lucide="box" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Sistem Gudangku</h1>
            <p class="text-xs text-gray-400">Masukkan akun kredensial petugas gudang untuk masuk</p>
        </div>

       <!-- Form Login -->
<form onsubmit="prosesLogin(event)" class="space-y-4 text-xs">
    <div>
        <label class="block font-semibold text-gray-700 mb-1">Username / Email</label>
        <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="input-username" required placeholder="admin" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800">
        </div>
    </div>

    <div>
        <label class="block font-semibold text-gray-700 mb-1">Kata Sandi</label>
        <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="password" id="input-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800">
        </div>
    </div>

    <div class="flex items-center justify-between text-gray-500 pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
            <span>Ingat saya</span>
        </label>
        <a href="#" onclick="alert('Hubungi Administrator Gudang untuk reset password.')" class="text-[#1d61d1] font-semibold hover:underline">Lupa sandi?</a>
    </div>

    <button type="submit" class="w-full bg-[#1d61d1] text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-md transition text-sm flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk ke Dashboard</span>
    </button>
</form>

<script>
    if (window.lucide) lucide.createIcons();

    function prosesLogin(event) {
        event.preventDefault();
        
        const username = document.getElementById('input-username').value.trim();
        const password = document.getElementById('input-password').value;

        // Validasi Kredensial Admin
        if (username === 'admin' && password === 'admin123') {
            sessionStorage.setItem('gudangku_auth', 'true');
            window.location.replace('index.html');
        } else {
            alert('Username atau Password salah!\nGunakan username: admin & password: admin123');
        }
    }
</script>
</body>
</html>
